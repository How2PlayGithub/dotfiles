# If a config.py file exists, this file is ignored unless it's explicitly loaded
# via config.load_autoconfig(). For more information, see:
# https://github.com/qutebrowser/qutebrowser/blob/main/doc/help/configuring.asciidoc#loading-autoconfigyml
# DO NOT edit this file by hand, qutebrowser will overwrite it.
# Instead, create a config.py - see :help for details.

config_version: 2
settings:
  bindings.commands:
    global:
      normal:
        <Ctrl+y>: spawn --userscript ytdl.sh
        '=': cmd-set-text -s :open
        T: hint links tab
        cs: cmd-set-text -s :config-source
        gJ: tab-move +
        gK: tab-move -
        gm: tab-move
        h: history
        pP: open -- {primary}
        pp: open -- {clipboard}
        pt: open -t -- {clipboard}
        qm: macro-record
        sH: config-cycle statusbar.show always never
        tH: config-cycle tabs.show multiple never
        tT: config-cycle tabs.position top left
  bindings.key_mappings:
    global:
      <Ctrl+6>: <Ctrl+^>
      <Ctrl+Enter>: <Ctrl+Return>
      <Ctrl+[>: <Escape>
      <Ctrl+i>: <Tab>
      <Ctrl+j>: <Return>
      <Ctrl+m>: <Return>
      <Enter>: <Return>
      <Shift+Enter>: <Return>
      <Shift+Return>: <Return>
  colors.tabs.bar.bg:
    global: '#1e1e2e'
  colors.tabs.even.bg:
    global: '#00000000'
  colors.tabs.even.fg:
    global: '#cdd6f4'
  colors.tabs.odd.fg:
    global: '#cdd6f4'
  colors.tabs.pinned.even.bg:
    global: darkseagreen
  colors.webpage.darkmode.algorithm:
    global: lightness-cielab
  colors.webpage.darkmode.enabled:
    global: false
  colors.webpage.darkmode.policy.page:
    global: always
  content.desktop_capture:
    https://discord.com: true
  content.headers.user_agent:
    global: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like
      Gecko) Chrome/137.0.0.0 Safari/537.36
    https://accounts.google.com/*: Mozilla/5.0 ({os_info}; rv:131.0) Gecko/20100101
      Firefox/131.0
  content.javascript.clipboard:
    https://chatgpt.com: access-paste
    https://discord.com: access-paste
    https://docs.vicinae.com: access-paste
    https://gemini.google.com: access-paste
    https://github.com: access-paste
    https://portfolio.kylerassweiler.ca: access-paste
    https://projecthub.arduino.cc: access-paste
    https://www.boot.dev: access-paste
    https://www.josean.com: access-paste
  content.javascript.enabled:
    global: true
  content.media.audio_capture:
    https://discord.com: false
  content.notifications.enabled:
    https://calendar.google.com: true
  content.register_protocol_handler:
    https://calendar.google.com?cid=%25s: true
    https://mail.google.com?extsrc=mailto&url=%25s: true
  statusbar.show:
    global: always
  tabs.position:
    global: left
  tabs.show:
    global: multiple
