exec = gsettings set org.gnome.desktop.interface gtk-theme 'Wallbash-Gtk'
exec = gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'

general {
    col.active_border = rgba(B298CBff) rgba(3E2952ff) 45deg
    col.inactive_border = rgba(0F1318ff) rgba(1B1F24ff) 45deg
}

group {
    col.border_active = rgba(B298CBff) rgba(3E2952ff) 45deg
    col.border_inactive = rgba(0F1318cc) rgba(1B1F24cc) 45deg
    col.border_locked_active = rgba(FFFFFFff) rgba(0C0D0Cff) 45deg
    col.border_locked_inactive = rgba(FFFFFFcc) rgba(FFFFFFcc) 45deg
}
